}

.tag.t1 { background: var(--t1); color: var(--t1i) } .tag.t2 { background: var(--t2); color: var(--t2i) } .tag.t3 { background: var(--t3); color: var(--t3i) }

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const safe = (u) => (/^https:\/\//i.test(u || "") ? u : "");
  const xh = (u) => ((safe(u).match(/x\.com\/([A-Za-z0-9_]{1,15})/i) || [])[1] || "");

  }
  function showTip(ev, html) { const t = $("#tip"); t.innerHTML = html; t.style.left = ev.clientX + "px"; t.style.top = ev.clientY + "px"; t.classList.add("on"); }
  function hideTip() { $("#tip").classList.remove("on"); }
  function centreY() { const top = small() ? 168 : 128, bottom = small() ? 268 : 250; return top + (H() - top - bottom) / 2; }
  function zoomTo(xy, k) {
    if (!svg) return;
    const [x, y] = P(xy);
    svg.transition().duration(reduced ? 0 : 650).call(zoom.transform, d3.zoomIdentity.translate(W() / 2, centreY()).scale(Math.min(60, k)).translate(-x, -y));
  }
  function fitToResults() {
    if (!svg) return;
    const pts = filtered().map(placeOf).filter(Boolean).map((p) => P(p.xy));
    if (!pts.length) return;
    const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
    const [x0, x1, y0, y1] = [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)];
    const top = small() ? 168 : 128, bottom = small() ? 268 : 250, availH = H() - top - bottom, availW = W() - 120;
    const k = Math.max(1, Math.min(8, 0.8 / Math.max((x1 - x0) / availW, (y1 - y0) / availH, 1e-3)));
    svg.transition().duration(reduced ? 0 : 650).call(zoom.transform, d3.zoomIdentity.translate(W() / 2, centreY()).scale(k).translate(-(x0 + x1) / 2, -(y0 + y1) / 2));
  }
  $("#zin").onclick = () => svg && svg.transition().duration(250).call(zoom.scaleBy, 1.8);
  $("#zout").onclick = () => svg && svg.transition().duration(250).call(zoom.scaleBy, 1 / 1.8);
  $("#zfit").onclick = () => svg && svg.transition().duration(reduced ? 0 : 450).call(zoom.transform, d3.zoomIdentity);

  function inView(rows) {
    if (!svg) return rows;
    const top = small() ? 150 : 110, bottom = small() ? 250 : 230;
    const [x0, y0] = transform.invert([0, top]), [x1, y1] = transform.invert([W(), H() - bottom]);
    return rows.filter((r) => { const p = placeOf(r); if (!p) return false; const [x, y] = P(p.xy); return x >= x0 && x <= x1 && y >= y0 && y <= y1; });
  }

  // ---------- Cards
  const sortRows = (rows) => rows.slice().sort((a, b) => ui.sort === "name" ? a.name.localeCompare(b.name) : ui.sort === "team" ? (a.teamSize ?? 999) - (b.teamSize ?? 999) || a.name.localeCompare(b.name) : (b.signalDate || "").localeCompare(a.signalDate || "") || a.name.localeCompare(b.name));
  const initials = (n) => n.replace(/[^\p{L}\p{N} ]/gu, "").split(" ").filter(Boolean).slice(0, 2).map((w) => w[0]).join("").toUpperCase() || "?";
  const starBtn = (r) => `<button type="button" class="star" data-star="${esc(r.id)}" aria-pressed="${star(r.id)}" aria-label="${star(r.id) ? "Unstar" : "Star"} ${esc(r.name)}"><svg width="17" height="17" viewBox="0 0 18 18" fill="${star(r.id) ? "currentColor" : "none"}" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M9 2.5l2 4.2 4.5.6-3.3 3.1.8 4.5L9 12.7 5 14.9l.8-4.5-3.3-3.1 4.5-.6z"/></svg></button>`;
  const srcTag = (r) => { const s = sourceOf(r); return s === "Found by Grok on X" ? `<span class="tag grok">Grok on X</span>` : s === "X post" ? `<span class="tag t1">X post</span>` : s === "Y Combinator" ? `<span class="tag t4">YC ${esc(r.batch || "")}</span>` : `<span class="tag">${esc(s)}</span>`; };
  function card(r) {
    const st = stageOf(r);
    return `<article class="card${ui.sel === r.id ? " sel" : ""}${statusOf(r) === "passed" ? " passed" : ""}" tabindex="0" data-id="${esc(r.id)}" aria-label="${esc(r.name)}. Press Enter for details.">
      <div class="c-top"><div class="mono" style="background:${col(r.sector)}" aria-hidden="true">${esc(initials(r.name))}</div>
        <div style="min-width:0"><div class="c-name">${esc(r.name)}</div><div class="c-sub">${st === "Not stated" ? "" : esc(st) + " · "}${esc(r.sector)}</div></div>${starBtn(r)}</div>
      <div class="c-one">${esc(r.oneLiner)}</div>
      <div class="c-tags">${placeText(r) ? `<span class="tag">${esc(placeText(r))}</span>` : ""}${srcTag(r)}${r.teamSize ? `<span class="tag">${r.teamSize} people</span>` : ""}${statusOf(r) !== "new" ? `<span class="tag t4">${statusLabel[statusOf(r)]}</span>` : ""}</div>
      <div class="c-foot"><span>${esc(r.signal)}</span><span class="num" style="flex:none">${fmt(r.signalDate)}</span></div>
    </article>`;
  }
  let railTimer;
  const scheduleRail = () => { clearTimeout(railTimer); railTimer = setTimeout(renderRail, 120); };
  function renderRail() {
    if (ui.view !== "map") return;
    if (!all.length) return;
    const rows = filtered(), vis = sortRows(inView(rows));
    const unplaced = rows.filter((r) => !placeOf(r)).length;
    const zoomed = transform.k > 1.05 || Math.abs(transform.x) > 5 || Math.abs(transform.y) > 5;
    $("#inview").textContent = zoomed ? `${vis.length} of ${rows.length} in view` : `${rows.length} ${rows.length === 1 ? "company" : "companies"}${unplaced ? ` · ${unplaced} with no location (see List)` : ""}`;
    const sel = ui.sel && rows.find((r) => r.id === ui.sel);
    const list = sel ? [sel, ...vis.filter((r) => r.id !== sel.id)] : vis;
    $("#cards").innerHTML = list.length
      ? list.slice(0, 40).map(card).join("") + (list.length > 40 ? `<div class="empty-card"><b>${list.length - 40} more</b>Zoom in, add a filter, or open the List view.</div>` : "")
      : `<div class="empty-card"><b>${rows.length ? "Nothing in this part of the map" : "No companies match these filters"}</b>${rows.length ? `<button type="button" class="link" data-fit="1" style="padding:0">Show all of Europe</button>` : `<button type="button" class="link" data-resetall="1" style="padding:0">Clear all filters</button>`}</div>`;
  }

  // ---------- List
  const COLS = [["name", "Company"], ["oneLiner", "What it does"], ["sector", "Sector"], ["place", "Where"], ["stage", "Stage"], ["teamSize", "Team"], ["signalDate", "Latest signal"], ["source", "Found via"], ["status", "My status"]];
  const statusSel = (r) => `<select class="status" data-status="${esc(r.id)}" data-s="${statusOf(r)}" aria-label="Status of ${esc(r.name)}">${STATUSES.map(([v, l]) => `<option value="${v}"${statusOf(r) === v ? " selected" : ""}>${l}</option>`).join("")}</select>`;
  function renderList() {
    if (ui.view !== "list") return;
    let rows = sortRows(filtered());
    if (ui.gsort) {
      const { k, dir } = ui.gsort;
      const v = (r) => k === "place" ? placeText(r) : k === "stage" ? ["Pre-seed", "Seed", "Series A", "Not stated"].indexOf(stageOf(r)) : k === "teamSize" ? r.teamSize ?? 999 : k === "source" ? sourceOf(r) : k === "status" ? STATUSES.findIndex((s) => s[0] === statusOf(r)) : r[k] ?? "";
      rows.sort((a, b) => { const x = v(a), y = v(b); return (typeof x === "number" ? x - y : String(x).localeCompare(String(y))) * dir; });
    }
    const ar = (k) => (ui.gsort && ui.gsort.k === k ? `<span class="arrow">${ui.gsort.dir > 0 ? "↑" : "↓"}</span>` : "");
    const aria = (k) => (ui.gsort && ui.gsort.k === k ? (ui.gsort.dir > 0 ? "ascending" : "descending") : "none");
    $("#list").innerHTML = !all.length ? "" : !rows.length ? `<div class="empty-card"><b>No companies match these filters</b><button type="button" class="link" data-resetall="1" style="padding:0">Clear all filters</button></div>` : `<div class="tablewrap"><table><caption class="vh">${rows.length} companies</caption><thead><tr>${COLS.map(([k, l]) => `<th scope="col" aria-sort="${aria(k)}"><button type="button" data-gsort="${k}">${l} ${ar(k)}</button></th>`).join("")}</tr></thead><tbody>
      ${rows.map((r) => `<tr tabindex="0" data-id="${esc(r.id)}"><td class="first">${esc(r.name)}${star(r.id) ? ` <span style="color:#d99a00" aria-label="starred">★</span>` : ""}</td><td><span class="clip">${esc(r.oneLiner)}</span></td><td><span class="tag ${tagCls(r.sector)}">${esc(r.sector)}</span></td><td style="white-space:nowrap">${esc(placeText(r) || "—")}</td><td>${esc(stageOf(r))}</td><td class="num" style="text-align:right">${r.teamSize ?? "—"}</td><td><span class="clip">${esc(r.signal)}</span><span class="muted num" style="font-size:12px">${fmt(r.signalDate)}</span></td><td style="white-space:nowrap">${esc(sourceOf(r))}</td><td>${statusSel(r)}</td></tr>`).join("")}
    </tbody></table></div>`;
  }

  // ---------- Selection and drawer
  function select(id, fromMap) {
    ui.sel = id; drawPins(); renderRail();
    $("#cards").scrollTo({ left: 0, behavior: reduced ? "auto" : "smooth" });
    if (!fromMap) { const r = all.find((x) => x.id === id); const p = r && placeOf(r); if (p) zoomTo(p.xy, Math.max(transform.k, 6)); }
  }
  let lastFocus = null;
  function openDrawer(id) {
    const r = all.find((x) => x.id === id); if (!r) return;
    if (!ui.open) lastFocus = document.activeElement;
    ui.open = id;
    const sigs = [{ signal: r.signal, signalDate: r.signalDate, signalUrl: r.signalUrl, source: r.source }, ...(r.alsoSeen || [])];
    const founders = (r.founders || []).map((f) => `<li>${esc(f.name)}${xh(f.x) ? ` · <a href="https://x.com/${esc(xh(f.x))}" target="_blank" rel="noopener noreferrer">@${esc(xh(f.x))}</a>` : ""}</li>`).join("");
    const p = placeOf(r);
    $("#drawer").innerHTML = `
      <div class="d-head"><div class="d-row"><div class="mono" style="background:${col(r.sector)}" aria-hidden="true">${esc(initials(r.name))}</div><div style="flex:1;min-width:0"><h2>${esc(r.name)}</h2><div class="c-sub">${esc(placeText(r) || "Location not stated")}${p && p.approx ? " · city not stated" : ""}</div></div>
        <button type="button" class="btn btn-white btn-sm" id="d-close">Close</button></div>
        <div class="d-actions"><span class="tag ${tagCls(r.sector)}">${esc(r.sector)}</span>${srcTag(r)}${statusSel(r)}${starBtn(r)}
          ${safe(r.website) ? `<a class="btn btn-white btn-sm" href="${esc(r.website)}" target="_blank" rel="noopener noreferrer">Website ↗</a>` : ""}${xh(r.companyX) ? `<a class="btn btn-white btn-sm" href="https://x.com/${esc(xh(r.companyX))}" target="_blank" rel="noopener noreferrer">@${esc(xh(r.companyX))} ↗</a>` : ""}</div></div>
      <div class="d-body">
        <div class="d-sec"><p style="margin:0;font-size:15px">${esc(r.oneLiner)}</p></div>
        <div class="d-sec"><h3>Signals</h3><ul>${sigs.map((s) => `<li>${esc(s.signal)}<div class="hint num">${fmt(s.signalDate)} · ${safe(s.signalUrl) ? `<a href="${esc(s.signalUrl)}" target="_blank" rel="noopener noreferrer">${esc(s.source)}</a>` : esc(s.source)}</div></li>`).join("")}</ul></div>
        ${founders ? `<div class="d-sec"><h3>Founders</h3><ul>${founders}</ul></div>` : ""}
        <div class="d-sec"><h3>On record</h3><ul><li>${r.stage ? `${esc(r.stage)}, as stated by ${esc(r.stageBy)}` : "Stage: no source states a round"}</li>${r.batch ? `<li>Y Combinator ${esc(r.batch)}</li>` : ""}${r.teamSize ? `<li>Team of ${r.teamSize}</li>` : ""}${r.founded ? `<li>Founded ${esc(r.founded)}</li>` : ""}</ul></div>
        ${(r.verifiedFacts || []).length ? `<div class="d-sec"><h3>Verified facts</h3><ul>${r.verifiedFacts.map((f) => `<li>${esc(f.statement)}<div class="hint">${esc(f.verified_against || "")}${safe(f.source_url) ? ` · <a href="${esc(f.source_url)}" target="_blank" rel="noopener noreferrer">source</a>` : ""}</div></li>`).join("")}</ul></div>` : ""}
        ${(r.companyClaims || []).length ? `<div class="d-sec"><h3>What the company says (not verified)</h3><ul>${r.companyClaims.map((c) => `<li>${esc(c.statement)}${safe(c.source_url) ? ` <a class="hint" href="${esc(c.source_url)}" target="_blank" rel="noopener noreferrer">source</a>` : ""}</li>`).join("")}</ul></div>` : ""}
        ${(r.unknowns || []).length ? `<div class="d-sec"><h3>Unknown</h3><ul>${r.unknowns.map((u) => `<li>${esc(u)}</li>`).join("")}</ul></div>` : ""}
        ${(r.checks || []).length ? `<div class="d-sec"><h3>What was checked</h3><ul>${r.checks.map((c) => `<li>${esc(c)}</li>`).join("")}</ul></div>` : ""}
        ${r.nextQuestion ? `<div class="d-sec"><h3>Next diligence question</h3><p style="margin:0;font-weight:500">${esc(r.nextQuestion)}</p></div>` : ""}
      </div>`;
    $("#drawer").classList.add("on"); $("#scrim").classList.add("on");
    $("#d-close").focus();
  }
  function closeDrawer() { ui.open = null; $("#drawer").classList.remove("on"); $("#scrim").classList.remove("on"); lastFocus && lastFocus.isConnected && lastFocus.focus(); }

  // ---------- Private pipeline (stars + statuses)
  let writing = Promise.resolve(), pending = false;
  function persistMine() {
    store.set("radar-mine", mine);
    if (!mineRef || !mineReady || pending) return; pending = true;
    writing = writing.then(async () => { pending = false; try { await mineRef.set({ star: mine.star, status: mine.status }); } catch { toast("Saved on this device only"); } });
  }
  function refreshAll(id) { renderChips(); renderRail(); renderList(); if (ui.open === id) openDrawer(id); }
  function setStar(id) { mine.star = star(id) ? mine.star.filter((x) => x !== id) : [...mine.star, id]; persistMine(); refreshAll(id); toast(star(id) ? "Starred" : "Unstarred"); }
  function setStatus(id, s) { if (s === "new") delete mine.status[id]; else mine.status[id] = s; persistMine(); refreshAll(id); toast(`Marked ${statusLabel[s]}`); }

  // ---------- Events
  let qT; $("#q").addEventListener("input", (e) => { clearTimeout(qT); qT = setTimeout(() => { ui.q = e.target.value; changed(); }, 140); });
  document.querySelectorAll("[data-view]").forEach((b) => b.addEventListener("click", () => { ui.view = b.dataset.view; store.set("radar-view2", ui.view); applyView(); }));
  function applyView() { $("#app").classList.toggle("listmode", ui.view === "list"); document.querySelectorAll("[data-view]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.view === ui.view))); renderList(); renderRail(); drawPins(); }
  document.addEventListener("change", (e) => { const s = e.target.closest("[data-status]"); if (s) setStatus(s.dataset.status, s.value); });
  document.addEventListener("click", (e) => {
    const t = e.target;
    const s = t.closest("[data-star]"); if (s) { e.stopPropagation(); setStar(s.dataset.star); return; }
    if (t.closest("[data-status]") || t.closest("a")) return;
    if (t.closest("[data-resetall]")) { resetAll(); return; }
    if (t.closest("[data-fit]")) { $("#zfit").click(); return; }
    const gs = t.closest("[data-gsort]"); if (gs) { const k = gs.dataset.gsort; ui.gsort = ui.gsort && ui.gsort.k === k ? { k, dir: -ui.gsort.dir } : { k, dir: k === "signalDate" ? -1 : 1 }; renderList(); return; }
    if (t.closest("#d-close")) { closeDrawer(); return; }
    const c = t.closest(".card"); if (c) { if (ui.sel === c.dataset.id) openDrawer(c.dataset.id); else select(c.dataset.id, false); return; }
    const tr = t.closest("tr[data-id]"); if (tr) openDrawer(tr.dataset.id);
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { if (ui.open) closeDrawer(); else if (popFor) { closePop(); renderChips(); } return; }
    if ((e.key === "Enter" || e.key === " ") && e.target.matches(".card, tr[data-id]")) { e.preventDefault(); openDrawer(e.target.dataset.id); }
    if (e.key === "/" && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); $("#q").focus(); }
  });
  $("#scrim").onclick = closeDrawer;

  // ---------- CSV of the current filter
  const cell = (v) => { let s = v == null ? "" : String(v); if (/^[=+\-@]/.test(s)) s = "'" + s; return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  $("#export").onclick = async () => {
    const rows = sortRows(filtered());
    const head = ["Company", "Website", "What it does", "Sector", "City", "Country", "Stage (as stated)", "Stated by", "Team size", "Latest signal", "Signal date", "Signal link", "Found via", "Founders", "My status", "Starred"];
    const csv = [head, ...rows.map((r) => [r.name, r.website, r.oneLiner, r.sector, r.city !== r.country ? r.city : "", r.country, r.stage || "Not stated", r.stageBy, r.teamSize ?? "", r.signal, r.signalDate ?? "", r.signalUrl, sourceOf(r), (r.founders || []).map((f) => f.name + (xh(f.x) ? ` (@${xh(f.x)})` : "")).join("; "), statusLabel[statusOf(r)], star(r.id) ? "yes" : ""])].map((l) => l.map(cell).join(",")).join("\r\n");
    const dl = window.claude?.use ? await window.claude.use("downloads").catch(() => null) : null;
    if (!dl) {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" }));
      a.download = `european-startup-radar-${new Date().toISOString().slice(0, 10)}.csv`;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      toast(`Saved ${rows.length} companies`); return;
    }
    try { await dl.save({ filename: `european-startup-radar-${new Date().toISOString().slice(0, 10)}.csv`, data: "\uFEFF" + csv }); toast(`Saved ${rows.length} companies`); } catch { toast("Not saved"); }
  };

  function renderLegend() {
    const c = tally(all, (r) => r.sector);
    $("#legend").innerHTML = SECTORS.filter(([n]) => c[n]).map(([n]) => `<span><i style="background:${col(n)}"></i>${esc(n)}</span>`).join("");
  }

  // ---------- Boot
  renderChips(); applyView();
  fetch("europe.json").then((r) => { if (!r.ok) throw 0; return r.json(); }).then((w) => { initMap(w); drawPins(); renderRail(); })
    .catch(() => { const l = $("#loading"); if (l) l.textContent = "The map couldn't load. The List view still works."; });
  (async () => {
    const db = window.claude?.use ? await window.claude.use("db").catch(() => null) : null;
    if (!db) {
      // Public copy (e.g. on Vercel): companies come from companies.json; stars and statuses stay in this browser.
      try {
        const [c, m] = await Promise.all([fetch("companies.json", { cache: "no-cache" }).then((r) => { if (!r.ok) throw 0; return r.json(); }), fetch("meta.json", { cache: "no-cache" }).then((r) => (r.ok ? r.json() : null)).catch(() => null)]);
        all = c; placeCache.clear();
        if (m) { const st = $("#stamp"); st.hidden = false; st.textContent = `Updated ${fmt(m.updatedOn)}`; }
        renderChips(); renderLegend(); drawPins(); renderRail(); renderList();
      } catch { $("#inview").textContent = "Couldn't load companies. Reload to try again."; }
      return;
    }
    const timer = setTimeout(() => { if (!all.length) $("#inview").textContent = "Still loading companies…"; }, 10000);
    db.doc("meta/radar").onSnapshot((s) => { const m = s.exists ? s.data() : null; const st = $("#stamp"); st.hidden = !m; if (m) st.textContent = `Updated ${fmt(m.updatedOn)}`; }, () => {});
    db.collection("startups").onSnapshot((snap) => {
      all = snap.docs.map((d) => ({ id: d.id, ...d.data() })); clearTimeout(timer); placeCache.clear();
      renderChips(); renderLegend(); drawPins(); renderRail(); renderList();
    }, (err) => { clearTimeout(timer); $("#inview").textContent = `Couldn't load companies (${err.code || "error"}). Reload to try again.`; });
    const user = await window.claude.use("user").catch(() => null);
    const uid = user ? await user.id().catch(() => null) : null;
    if (uid) {
      mineRef = db.collection("data/users/" + uid).doc("radar");
      mineRef.onSnapshot((s) => {
        if (s.exists) { const d = s.data(); mine = { star: [...new Set([...(d.star || []), ...(mineReady ? [] : mine.star)])], status: { ...(mineReady ? {} : mine.status), ...(d.status || {}) } }; store.set("radar-mine", mine); }
        const first = !mineReady; mineReady = true; if (first) persistMine();
        renderChips(); renderRail(); renderList();
      }, () => {});
    }
  })();
})();
</script>
